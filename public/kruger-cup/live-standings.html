<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Kruger Cup — Live Standings</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071322;color:#f4f6fa;font:15px system-ui,Arial;padding:16px;line-height:1.45}main{max-width:960px;margin:auto}a{color:#f4be63}h1{font-size:26px;margin:10px 0}h2{color:#f4be63;font-size:20px}p{color:#bccbd9}.tabs{display:flex;gap:10px;margin:16px 0}button{padding:11px 18px;background:#183249;color:white;border:1px solid #44627a;border-radius:9px;font:inherit}.active{background:#d5a859;color:#06121d}section{margin:20px 0;padding:12px;background:#101f30;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 5px;border-bottom:1px solid #34495a;text-align:right}th:first-child,td:first-child{text-align:left;max-width:220px;word-break:normal}th{color:#f4be63}tr.qualified{background:#18382b}.status{padding:10px;border-radius:8px;background:#183249}.error{background:#653028}.hint{font-size:13px;color:#b7c9dc}@media(min-width:700px){body{padding:25px}table{font-size:15px}th,td{padding:12px}} </style></head><body><main><a href="./index.html">← Tournament home</a><h1>🎾 Kruger Cup — Live Standings</h1><p>Direct connection to official recorded scores · Refreshes every 10 seconds.</p><div class="tabs"><button id="challenger" class="active">Challenger</button><button id="championship">Championship</button><button id="refresh">↻ Refresh now</button></div><div id="status" class="status">Loading scores from Supabase…</div><div id="tables"></div><p class="hint">PL = matches played; FOR and AG = games won and lost; PTS = games won. Qualifiers highlighted green. Live scores require internet access.</p></main><script>
const DATA={Championship:{A:[['BRYAN THERON','ANTON GROTE'],['DANYAAL NOMANI','SIRAAJ SHAIK'],['FIAZ BHIKHOO','ZAYD METHAR'],['FAEEZ SEBASTIAN','DURELL PILLAY']],B:[['IMAAD ARABI','FAHEEM NOMANI'],['UWAIZ PATEL','M ASHRAF ARABI'],['YUSUF MOOLA','JOSEPH VAN DER MERWE'],['YUSUF PACKERY','AHMED MUNGALEE']],C:[['LIAM MORGAN','MAAZ RANDERA'],['RIDWAN SUJEE','JUSTIN VAN STADEN'],['YUSUF ASVAT','JOSHUA HOFFMAN'],['ZAHEER METHAR','AHMED ISMAIL']]},Challenger:{A:[['ABDURAHMAAN JOGI','HUZAIFAH SUJEE'],['COLE PILLAY','MIKEL PILLAY'],['SCHARL VAN DEN BERG','JUDE VAN DEN BERG'],['UZAIR ISMAIL','ZUHAYR ISMAIL'],['WIMPIE KOTZE','SPANNER VAN DER MESCHT'],['WARREN MORGAN','ZINIDINE MORGAN'],['YAHYA SUJEE','ARMAAN BHIKOO']],B:[['AYAAN MOHAMED','HOOSEIN PATEL'],['AADAM NOMANI','MOHAMED MOOLA'],['IRSHAAD MOOLA','EESA MOOLA'],['JOHANN RADEMEYER','MICHAEL SMIT'],['MUHAMMAD MANGERAH','EBRAHIM MANGERAH'],['MUHAMMED SALEEM ISMAIL','UTHMAAN FAKIR'],['STIAAN DUVENHAGE','DEWALD DUVENHAGE']]}};
const API='https://xkxmnljalxqjovokfmub.supabase.co/rest/v1/kruger_cup_match_updates';
const KEY="sb_publishable_U6nbcH9-z7u_mth63-isbw_QwuVIWyr";
const fixtures={};for(const [division,groups] of Object.entries(DATA)){const letter=division==='Challenger'?'H':'C';for(const [g,pairs] of Object.entries(groups)){let k=0;for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++){fixtures[letter+g+'-'+(++k)]={division,group:g,i,j};}}}
let division='Challenger',loading=false;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;','\'':'&#39;'}[c]));
function render(rows){const fragment=[];for(const [group,pairs] of Object.entries(DATA[division])){const stats=pairs.map((p,i)=>({id:i,team:p.join(' / '),played:0,pts:0,against:0,diff:0}));for(const row of rows){const m=fixtures[row.id];if(!m||m.division!==division||m.group!==group)continue;const d=row.payload||{};if(!['final','walkover'].includes(d.status)||d.aScore==null||d.bScore==null)continue;const a=Number(d.aScore),b=Number(d.bScore);if(!Number.isFinite(a)||!Number.isFinite(b))continue;stats[m.i].played++;stats[m.j].played++;stats[m.i].pts+=a;stats[m.i].against+=b;stats[m.j].pts+=b;stats[m.j].against+=a;}for(const t of stats)t.diff=t.pts-t.against;stats.sort((a,b)=>b.pts-a.pts||b.diff-a.diff||a.id-b.id);fragment.push('<section><h2>'+division+' · Group '+group+'</h2><table><thead><tr><th>Pair</th><th>PL</th><th>FOR</th><th>AG</th><th>DIFF</th><th>PTS</th></tr></thead><tbody>'+stats.map((x,i)=>'<tr class="'+(i<(division==='Challenger'?4:2)?'qualified':'')+'"><td>'+(i+1)+'. '+escapeHTML(x.team)+'</td><td>'+x.played+'</td><td>'+x.pts+'</td><td>'+x.against+'</td><td>'+(x.diff>0?'+':'')+x.diff+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</tbody></table></section>')}document.getElementById('tables').innerHTML=fragment.join('')}
let savedRows=[];
async function refresh(){if(loading)return;loading=true;const el=document.getElementById('status');try{const url=API+'?select=id,payload,published&published=eq.true&limit=250';const resp=await fetch(url,{headers:{apikey:KEY,'Cache-Control':'no-cache'},cache:'no-store',signal:AbortSignal.timeout(12000)});if(!resp.ok)throw Error('Supabase HTTP '+resp.status);const rows=await resp.json();if(!Array.isArray(rows)||rows.length<42)throw Error('Incomplete scoreboard response');savedRows=rows;render(rows);const completed=rows.filter(x=>fixtures[x.id]&&['final','walkover'].includes(x.payload?.status)).length;el.className='status';el.textContent='● LIVE · '+completed+' completed group matches · Synced '+new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){el.className='status error';el.textContent='⚠ Unable to refresh live standings: '+e.message+(savedRows.length?' · Showing last successful refresh':' · Check internet connection');if(savedRows.length)render(savedRows);else document.getElementById('tables').innerHTML='<p>Scores are not available. Please reconnect and try again.</p>';}finally{loading=false}}
for(const d of ['Challenger','Championship'])document.getElementById(d.toLowerCase()).onclick=()=>{division=d;document.getElementById('challenger').classList.toggle('active',d==='Challenger');document.getElementById('championship').classList.toggle('active',d==='Championship');if(savedRows.length)render(savedRows);else refresh()};
document.getElementById('refresh').onclick=refresh;window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden)refresh()},10000);refresh();
</script></body></html>
